name: Check GIT_PAT
on:
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Validate GIT_PAT against ai-daily-digest
        env:
          GIT_PAT: ${{ secrets.GIT_PAT }}
        run: |
          set -u
          api() {
            curl -sS -o /tmp/body -w '%{http_code}' \
              -H "Authorization: Bearer $GIT_PAT" \
              -H "Accept: application/vnd.github+json" \
              "$1"
          }

          # 1. token is valid at all + can read repo metadata
          code=$(api "https://api.github.com/repos/ZH-L1N/ai-daily-digest")
          echo "repo GET            -> $code"
          if [ "$code" != "200" ]; then cat /tmp/body; exit 1; fi

          push=$(python3 -c "import json;print(json.load(open('/tmp/body')).get('permissions',{}).get('push'))")
          echo "contents write      -> $push"

          # 2. the exact call run.py:99 makes
          code=$(api "https://api.github.com/repos/ZH-L1N/ai-daily-digest/contents/2026?ref=main")
          echo "contents GET (r.py) -> $code"
          if [ "$code" != "200" ]; then cat /tmp/body; exit 1; fi

          [ "$push" = "True" ] || { echo "ERROR: token lacks Contents:write"; exit 1; }
          echo "OK: GIT_PAT valid, can read and write ai-daily-digest contents"
