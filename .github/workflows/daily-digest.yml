name: AI Daily Digest

on:
  schedule:
    # `timezone:` is honored by GitHub Actions (IANA TZ shipped 2026-03-19; DST-aware).
    # GitHub `schedule:` cron is best-effort: real delays run 45 min–2 h+, occasionally
    # ~4 h, worst at the top of the hour. Target 4:43am ET (off-top-of-hour minute): a
    # typical 45 min–2 h delay lands it ~5:30–6:45am ET, a worst-case ~4 h delay ~8:45am.
    # Dropped runs are possible (no
    # retry); the Slack post is the heartbeat. External workflow_dispatch is the
    # documented upgrade if punctuality becomes critical.
    - cron: '43 4 * * *'
      timezone: 'America/New_York'
  workflow_dispatch: {}  # manual trigger for testing

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Ensure ffmpeg (multi-chunk audio concat; non-fatal — byte-join fallback exists)
        run: ffmpeg -version >/dev/null 2>&1 || (sudo apt-get update && sudo apt-get install -y ffmpeg) || echo "ffmpeg unavailable; run.py will byte-join multi-chunk audio"
      - run: python run.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AGENT_ID: ${{ secrets.AGENT_ID }}
          ENVIRONMENT_ID: ${{ secrets.ENVIRONMENT_ID }}
          GIT_PAT: ${{ secrets.GIT_PAT }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
